name: Release

# Builds ds4-translator/ds4-ctl and publishes a downloadable tarball whenever
# a version tag (v*) is pushed to main, so users can install without needing
# a compiler (see README's "Download a release" instructions), and updates the
# Arch Linux pacman repository (on GitHub Pages) with the same version.
on:
  push:
    tags:
      - 'v*'

# Read-only by default; the one job that publishes the release asks for more.
permissions:
  contents: read

jobs:
  # A tag must not publish a build that fails the test suite.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history + tags: `git describe --tags` (used as a sanity
          # check below, and by anyone rebuilding from this same checkout)
          # needs more than the tagged commit alone to resolve reliably.
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps

      - name: Build
        run: make all VERSION="${GITHUB_REF_NAME}"

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIST_NAME="ds4-translator-${VERSION}"
          mkdir -p "dist/${DIST_NAME}"
          # Clean, tracked-files-only source tree (no .git, no build output,
          # no local dev artifacts) plus the binaries just built above, so
          # extracting the tarball and running `sudo make install` works
          # immediately without needing a compiler.
          git archive HEAD | tar -x -C "dist/${DIST_NAME}"
          # Copy the whole build/ dir, .o files included — not just the
          # final binaries — so every target in the Makefile's dependency
          # graph is already satisfied and `make install` on the extracted
          # tarball does zero compiling (the point of shipping a release:
          # no compiler required).
          mkdir -p "dist/${DIST_NAME}/build"
          cp -r build/. "dist/${DIST_NAME}/build/"
          # Fallback for `make` inside the extracted tarball, which has no
          # .git for `git describe` to read from.
          echo "${VERSION}" > "dist/${DIST_NAME}/VERSION"
          tar -czf "${DIST_NAME}.tar.gz" -C dist "${DIST_NAME}"
          echo "ASSET_PATH=${DIST_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true

  # Builds the same tag as pacman packages and a repository database (see
  # packaging/arch/README.md). Runs only after the tarball release succeeded,
  # so a tag that fails to build publishes nothing. The result is handed to the
  # `deploy-arch-repo` job below as a workflow artifact.
  arch-repo:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          # multilib provides lib32-glibc/lib32-gcc-libs, needed for the
          # 32-bit libudev-sony-spoof32.so. Keep this list in sync with
          # makedepends/depends in packaging/arch/PKGBUILD.in. git comes
          # before checkout so the full history and tags are fetched with
          # git rather than a source archive.
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git \
            clang bpf cmake qt6-base qt6-declarative qt6-svg \
            lib32-glibc lib32-gcc-libs libusb libbpf systemd kmod

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # `git describe --tags` derives the package version.
          fetch-depth: 0

      - name: Build packages
        run: |
          # No secrets in this step: makepkg runs the project's build scripts,
          # and nothing they execute may be able to reach the signing key.
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder .
          git config --global --add safe.directory "$PWD"
          runuser -u builder -- git config --global --add safe.directory "$PWD"
          runuser -u builder -- make arch-pkg

      - name: Sign packages and build the repository database
        env:
          # Signing-subkey export (see packaging/arch/README.md). When the
          # secret is not set, e.g. on a fork, everything stays unsigned.
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
        run: |
          # POSIX sh (this job runs in an Arch container): the positional
          # parameters stand in for an array of extra make arguments.
          set --
          if [ -n "$ARCH_GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$ARCH_GPG_PRIVATE_KEY" | runuser -u builder -- gpg --batch --import
            fpr=$(runuser -u builder -- gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
            [ -n "$fpr" ] || { echo "ARCH_GPG_PRIVATE_KEY did not import a key" >&2; exit 1; }
            # Same detached binary signatures makepkg --sign would have made.
            for pkg in build/arch/*.pkg.tar.zst; do
              runuser -u builder -- gpg --batch --yes --local-user "$fpr" --detach-sign --no-armor "$pkg"
            done
            set -- "ARCH_SIGN_KEY=$fpr"
          else
            echo "::warning::ARCH_GPG_PRIVATE_KEY is not set; publishing unsigned packages."
          fi
          runuser -u builder -- make arch-repo "$@"

      - name: Assemble the site
        run: |
          # Only what pacman and users fetch: the packages, the database, their
          # signatures and the public key. The .sig files are absent when the
          # build was unsigned.
          mkdir site
          cd build/arch
          cp -- ./*.pkg.tar.zst ds4-translator.db ds4-translator.files ../../site/
          cp -- ./*.pkg.tar.zst.sig ds4-translator.db.sig ds4-translator.files.sig ../../site/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/packaging/arch/ds4-translator.pub.asc" \
             "$GITHUB_WORKSPACE/packaging/arch/index.html" ../../site/

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-repo-site
          path: site/
          if-no-files-found: error

  # Publishes the pacman repository on GitHub Pages. A release's assets can't
  # be the home of a rolling repository: with release immutability enabled
  # they are locked once published, while Pages replaces the whole site on each
  # deploy and keeps one stable URL. Needs Pages set to the "GitHub Actions"
  # source and a `v*` tag rule on the github-pages environment (see
  # packaging/arch/README.md).
  deploy-arch-repo:
    needs: arch-repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; never cancel one that is already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-repo-site
          path: site

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
